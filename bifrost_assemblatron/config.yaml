
#-Basic info----------------------------------------------------------------------------------------
display_name: assemblatron
#name is compound of display_name, code version, resource version
name: assemblatron__v2.3.3
version:
  schema: ["v2_1_0"]
  code: v2.3.3
#---------------------------------------------------------------------------------------------------

#-Details-------------------------------------------------------------------------------------------
details:
  target: [sample]
  description: >
    This does de-novo assembly on a sample using SPAdes, and then filters them for minimum contig 
    length. In the process it gathers metrics on many aspects for the use of QC. .
#---------------------------------------------------------------------------------------------------

#-Category info-------------------------------------------------------------------------------------
category: [contigs]
#---------------------------------------------------------------------------------------------------

#-Install-------------------------------------------------------------------------------------------
install:
  path: # Set by install program
#---------------------------------------------------------------------------------------------------

#-Options-------------------------------------------------------------------------------------------
options:
  cov_threshold: 10
  min_length: 500
#---------------------------------------------------------------------------------------------------

#-Required resource files---------------------------------------------------------------------------
resources:
  adapters_fasta: "resources/adapters.fasta"
#---------------------------------------------------------------------------------------------------

#-Requirements to run component---------------------------------------------------------------------
requirements:
  sample:
    categories:
      paired_reads:
        summary:
          data:
      size_check:
        summary:
          has_min_num_of_reads: true
#---------------------------------------------------------------------------------------------------

